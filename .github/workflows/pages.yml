name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'scripts/**'
      - '*/src/**'
      - 'rpkg/src/rust/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The root rust-toolchain.toml (#1243) pins the repo to stable, and a
    # toolchain file outranks the `rustup default nightly` that
    # dtolnay/rust-toolchain@nightly sets below — so cargo resolved to stable
    # and rejected the -Z flags ("-Z ... only accepted on the nightly
    # channel"). This job's rustdoc builds need nightly (-Z rustdoc-map,
    # -Z unstable-options), so override the toolchain file explicitly:
    # RUSTUP_TOOLCHAIN sits above it in rustup's resolution order.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7

      # miniextendr-api/build.rs calls `R RHOME` to resolve libR for linking.
      # Rustdoc-only builds don't link — build.rs just has to not panic, and
      # its `r_home` existence check accepts any valid directory. Dummy with
      # $RUNNER_TEMP (same pattern as dvs2's CI). Must be set from a step —
      # the `runner` context is not available in job-level `env:`.
      - name: Set dummy R_HOME
        run: echo "R_HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@nightly

      - name: Build rustdoc (workspace crates)
        env:
          RUSTFLAGS: --cfg=docsrs
          RUSTDOCFLAGS: >-
            --cfg=docsrs
            -Z unstable-options
            --document-private-items
            --document-hidden-items
            --show-type-layout
            --enable-index-page
            --generate-link-to-definition
        run: cargo doc --no-deps -Z rustdoc-map -p miniextendr-api -p miniextendr-macros -p miniextendr-lint -p miniextendr-engine

      # rpkg/src/rust/Cargo.toml [patch.crates-io] points at
      # ../../vendor/miniextendr-api etc. Populate vendor/ so the
      # patch paths resolve. `just vendor` calls `cargo revendor` directly;
      # does NOT need autoconf or `just configure` (no Rscript, no Makevars).
      #
      # The rpkg rustdoc build requires `just vendor` (autoconf + cargo-revendor
      # + R headers) and adds ~5 min plus failure points. Mark these steps
      # continue-on-error so the site still deploys when rpkg-specific tooling
      # regresses; workspace rustdoc + Zola build remain strict (#79).
      - name: Install cargo-revendor
        continue-on-error: true
        run: cargo install --path cargo-revendor

      - name: Restore rpkg vendor directory cache
        continue-on-error: true
        id: rpkg-vendor-cache
        uses: actions/cache/restore@v6
        with:
          path: rpkg/vendor
          key: ${{ runner.os }}-rpkg-vendor-${{ hashFiles('Cargo.lock', 'rpkg/src/rust/Cargo.lock', 'miniextendr-api/**/*.rs', 'miniextendr-macros/**/*.rs', 'miniextendr-lint/**/*.rs') }}

      - name: Install just
        continue-on-error: true
        if: steps.rpkg-vendor-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@just

      - name: Generate rpkg/vendor
        continue-on-error: true
        if: steps.rpkg-vendor-cache.outputs.cache-hit != 'true'
        run: just vendor

      - name: Save rpkg vendor directory cache
        continue-on-error: true
        if: steps.rpkg-vendor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: rpkg/vendor
          key: ${{ steps.rpkg-vendor-cache.outputs.cache-primary-key }}

      - name: Build rustdoc (rpkg)
        continue-on-error: true
        env:
          RUSTFLAGS: --cfg=docsrs
          RUSTDOCFLAGS: >-
            --cfg=docsrs
            -Z unstable-options
            --document-private-items
            --document-hidden-items
            --show-type-layout
            --generate-link-to-definition
        run: cargo doc --no-deps -Z rustdoc-map --manifest-path rpkg/src/rust/Cargo.toml

      # Merge rpkg rustdoc crate dirs into the workspace target/doc WITHOUT
      # overwriting the workspace index.html / crates.js that the workspace
      # build produced with --enable-index-page. After merging, regenerate
      # crates.js so the workspace index links to rpkg crates too.
      - name: Merge rpkg rustdoc into main docs
        continue-on-error: true
        run: |
          if [ -d rpkg/src/rust/target/doc ]; then
            # Copy rpkg crate directories but preserve workspace index.html,
            # crates.js, and search-index.js.
            for item in rpkg/src/rust/target/doc/*; do
              name=$(basename "$item")
              case "$name" in
                index.html|crates.js|search-index.js|help.html|settings.html|static.files|SourceFiles.html) ;;
                *)
                  if [ ! -e "target/doc/$name" ]; then
                    cp -r "$item" "target/doc/$name"
                  fi
                  ;;
              esac
            done
          fi

      - name: Install Zola
        run: |
          ZOLA_VERSION="0.22.1"
          curl -sL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv zola /usr/local/bin/

      - name: Generate manual from docs/
        run: bash scripts/docs-to-site.sh

      - name: Generate roadmap data (issues)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/data
          gh issue list --state open --limit 500 \
            --json number,title,labels,url,createdAt,updatedAt,assignees,state \
            > site/data/issues.json

      - name: Build Zola site
        run: cd site && zola build

      - name: Copy rustdoc into site
        run: |
          cp -r target/doc site/public/rustdoc
          rm -f site/public/rustdoc/.lock

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Fix permissions
        run: |
          chmod -c -R +rX "site/public" | while read -r line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
