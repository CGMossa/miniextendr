  # ===========================================================================
  # R Package: Test suite (Linux only)
  # ===========================================================================
  r-tests:
    name: R tests / Linux
    runs-on: ubuntu-latest
    # Fast source-mode leg: full suite minus the gctorture-heavy files (those
    # run once per PR in r-stress-tests below), plus the heap-check rounds
    # (main/label) and the Valgrind ALTREP pass. Before the stress split this
    # job bundled everything and had outgrown even a 90-min cap on main pushes
    # (suite 34 min + 3 heap-check rounds = ~140 min -> guaranteed timeout).
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.r == 'true'

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      # Stress files run in r-stress-tests; this also keeps the 3x heap-check
      # rounds below within the job budget (they re-run the whole suite).
      MINIEXTENDR_SKIP_STRESS: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: rpkg
          extra-packages: any::testthat
          needs: check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rpkg/src/rust -> target
          shared-key: r-tests
          cache-on-failure: true

      - name: Install package (source mode)
        # Source-mode smoke test: no vendor tarball, no cargo-revendor needed.
        # configure.ac detects source install from the absence of inst/vendor.tar.xz
        # and lets cargo resolve deps normally (network or monorepo path overrides).
        run: R CMD INSTALL rpkg

      - name: Run tests
        working-directory: rpkg
        shell: bash
        run: Rscript -e "testthat::test_local()"

      - name: Run tests with heap checking (3 rounds, randomized order)
        # Heap checking (glibc MALLOC_CHECK_, 3 randomized rounds) is the
        # malloc-discipline guard. Gate it on PRs behind the `heap-check` label
        # so routine PRs stay fast; still run it unconditionally on
        # push-to-main, the weekly schedule, and manual dispatch so merged code
        # keeps its safety net. The rounds inherit MINIEXTENDR_SKIP_STRESS
        # (~5 min each, not ~35): heap-check hunts malloc/free corruption
        # across the whole suite, while the gctorture files have their own
        # dedicated job — running torture under MALLOC_CHECK_ three extra
        # times is what used to push this job past any timeout.
        if: >-
          github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'heap-check')
        working-directory: rpkg
        shell: bash
        env:
          # MALLOC_CHECK_=3: glibc checks heap consistency on every malloc/free
          # and aborts immediately on corruption (not lazily). This catches
          # heap-corrupting UB at the point it happens, not later.
          MALLOC_CHECK_: "3"
          # MALLOC_PERTURB_: fills freed memory with a non-zero pattern,
          # making use-after-free crashes deterministic instead of sporadic.
          MALLOC_PERTURB_: "165"
        run: |
          for i in 1 2 3; do
            echo "=== Heap-checked test run $i/3 ==="
            Rscript -e "testthat::test_local()" || exit 1
          done

      - name: Run ALTREP tests under Valgrind
        if: always()
        working-directory: rpkg
        shell: bash
        run: |
          sudo apt-get install -y valgrind 2>/dev/null || true
          if command -v valgrind &>/dev/null; then
            echo "=== Valgrind memcheck on ALTREP materialization ==="
            R -d "valgrind --tool=memcheck --leak-check=full --track-origins=yes --error-exitcode=1" \
              -e 'library(miniextendr); testthat::test_local(filter = "altrep-materialization")' \
              2>&1 | tee /tmp/valgrind.log || true
            echo "=== Valgrind summary ==="
            grep -A 5 "ERROR SUMMARY\|Invalid read\|Invalid write\|Use of uninitialised" /tmp/valgrind.log || echo "No errors found"
          else
            echo "Valgrind not available, skipping"
          fi

  # ===========================================================================
  # R Package: GC-stress tests (gctorture) — sharded
  # ===========================================================================
  # The single place the gctorture-heavy test files run per PR (every other
  # suite-running job sets MINIEXTENDR_SKIP_STRESS=1 — they were all running
  # the same ~31 min of torture, five times per push). The dominant cost is
  # the dynamic no-arg fixture sweep in test-gc-stress-fixtures.R; it splits
  # across the shards by fixture index (MINIEXTENDR_STRESS_SHARD=k/n, see
  # helper-gc-stress.R), and the other stress files are distributed via the
  # testthat filter so the shards stay balanced. Per-PR coverage is unchanged:
  # same fixtures, same iteration counts, run once instead of five times. The
  # nightly gctorture-nightly.yml step=100 full-suite sweep remains the deep net.
  r-stress-tests:
    name: R GC-stress tests / shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.r == 'true'
    strategy:
      fail-fast: false
      # Three shards, balanced from measured timings (run 29073963629: the
      # 2-shard layout ran 20.0 / 20.9 min of tests; the sweep is ~24 min of
      # that total, the explicit fixture-file blocks ~3 min, the three whole
      # files ~4 / ~3 / ~2.5 min). Each shard = one sweep third (~8 min) +
      # the explicit blocks (~3 min, run per-shard — the sweep file is in
      # every filter) + one whole stress file, so ~14-15 min of tests each.
      matrix:
        include:
          # Shard 1: sweep third 1 + the ExternalPtr self-root file.
          - shard: "1/3"
            filter: "gc-stress-fixtures|externalptr-self-root"
          # Shard 2: sweep third 2 + the iter-to-dataframe file.
          - shard: "2/3"
            filter: "gc-stress-fixtures|iter-to-dataframe"
          # Shard 3: sweep third 3 + the dataframe-deserialize file.
          - shard: "3/3"
            filter: "gc-stress-fixtures|dataframe-deserialize"

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      MINIEXTENDR_STRESS_SHARD: ${{ matrix.shard }}

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: rpkg
          extra-packages: any::testthat
          needs: check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rpkg/src/rust -> target
          # Same source-mode build as r-tests — share its cache rather than
          # keeping per-shard copies of an identical target dir.
          shared-key: r-tests
          cache-on-failure: true

      - name: Install package (source mode)
        # Same source-mode install as r-tests: no vendor tarball, configure.ac
        # detects source install and resolves the workspace via path overrides.
        run: R CMD INSTALL rpkg

      - name: Run GC-stress tests
        working-directory: rpkg
        shell: bash
        run: Rscript -e 'testthat::test_local(filter = "${{ matrix.filter }}")'

  # ===========================================================================
  # Feature runtime legs (scheduled only)
  # ===========================================================================
  # rpkg's tools/detect-features.R denylists the codegen selectors
  # (worker-default, strict-default, coerce-default, fast-default, r6-default,
  # s7-default), nonapi, indicatif, and growth-debug, so no PR-gating job ever
  # builds — let alone runs — the R wrappers those features generate
  # (audit A5/A10). Each leg rebuilds rpkg with one bundle of denylisted
  # features on top of the auto-detected base set and runs testthat against it.
  #
  # The extras, worker-default, r6-default, and s7-default legs run the full
  # suite. extras/worker-default features are additive/transparent; the class
  # legs became full-suite-safe in #1113, which made every #[miniextendr] impl
  # block in rpkg explicitly `env` — the class flip now only reaches the one
  # deliberately bare probe (FdefaultProbe in feature_default_fixtures.rs) plus
  # the divergence assertions in tests/testthat/test-feature-defaults.R.
  # The strict-default, coerce-default, and fast-default legs stay filtered to
  # the feature-default fixture tests: they flip conversion semantics /
  # preconditions for every parameter suite-wide, so the pre-existing suite
  # fails by design under them.
  # The fast-default leg additionally runs the two fast_default unit tests in
  # miniextendr-macros/src/tests.rs, which no other job compiles+runs.
  #
  # Weekly-only + workflow_dispatch: seven extra full rpkg builds are too heavy
  # for a per-PR gate. Intentionally NOT in ci-success.needs; failures surface
  # via the job summary (same pattern as gctorture-nightly.yml).
  feature-legs:
    name: Feature runtime leg / ${{ matrix.leg }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: extras
            features: nonapi,indicatif,growth-debug
            filter: ""
          - leg: worker-default
            features: worker-default
            filter: ""
          # The class legs run the full suite (#1113): rpkg's impl blocks are
          # explicitly `env`, so the class flip only reaches the deliberate
          # probe. strict/coerce cannot ride on them — they flip conversion
          # semantics suite-wide — so they get their own fixture-filtered
          # rows. They must also stay separate from EACH OTHER: under
          # coerce-default, lossy-int params convert via R's integer native
          # type, which masks the strict/no_strict divergence the fixtures
          # assert (#1112).
          - leg: r6-default
            features: r6-default
            filter: ""
          - leg: s7-default
            features: s7-default
            filter: ""
          - leg: strict-default
            features: strict-default
            filter: feature-defaults
          - leg: coerce-default
            features: coerce-default
            filter: feature-defaults
          - leg: fast-default
            features: fast-default
            filter: feature-defaults

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      # gctorture coverage lives in the sharded r-stress-tests job + nightly.
      MINIEXTENDR_SKIP_STRESS: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: rpkg
          extra-packages: any::testthat
          needs: check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rpkg/src/rust -> target
          shared-key: feature-leg-${{ matrix.leg }}
          cache-on-failure: true

      # The fast-default leg is also the only place the two fast_default
      # unit tests in miniextendr-macros/src/tests.rs run: clippy_all compiles
      # them (full-codegen includes fast-default) but never executes them.
      - name: Run fast_default unit tests (miniextendr-macros)
        if: matrix.leg == 'fast-default'
        run: cargo test -p miniextendr-macros --features fast-default fast_default

      # configure.ac skips feature auto-detection when CARGO_FEATURES is set,
      # so the base set is composed here: what detect-features.R would have
      # picked on this runner, plus the leg's denylisted features. Rust must
      # already be on PATH (the arrow/datafusion rules probe rustc --version).
      - name: Compose CARGO_FEATURES (detected base + leg features)
        run: |
          base="$(Rscript rpkg/tools/detect-features.R)"
          if [ -z "$base" ]; then
            echo "detect-features.R returned an empty base feature set" >&2
            exit 1
          fi
          echo "CARGO_FEATURES=${base},${{ matrix.features }}" >> "$GITHUB_ENV"
          echo "CARGO_FEATURES = ${base},${{ matrix.features }}"

      - name: Install package (source mode)
        # Same source-mode install as r-tests: no vendor tarball, configure
        # picks up CARGO_FEATURES from the environment.
        run: R CMD INSTALL rpkg

      - name: Run tests
        working-directory: rpkg
        shell: bash
        run: |
          if [ -n "${{ matrix.filter }}" ]; then
            Rscript -e 'testthat::test_local(filter = "${{ matrix.filter }}")'
          else
            Rscript -e 'testthat::test_local()'
          fi

      - name: Surface failure in job summary
        if: failure()
        run: |
          {
            echo "## Feature runtime leg '${{ matrix.leg }}' FAILED"
            echo ""
            echo "CARGO_FEATURES: \`$CARGO_FEATURES\`"
            echo ""
            echo "This scheduled leg is the only runtime coverage for its"
            echo "denylisted features. Reproduce locally with:"
            echo ""
            echo '```'
            echo "CARGO_FEATURES=\"$CARGO_FEATURES\" R CMD INSTALL rpkg"
            echo "cd rpkg && Rscript -e 'testthat::test_local(filter = \"${{ matrix.filter }}\")'  # empty filter = full suite"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Cross-package trait ABI tests
  # ===========================================================================
  cross-package-tests:
    name: Cross-Package Trait ABI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.r == 'true'
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: rpkg
          extra-packages: any::testthat, any::devtools
          needs: check

      - name: Install autoconf
        # ubuntu-latest images ship autoconf; the apt path is only a fallback
        # for image changes (saves ~30-60 s of apt-get update per job).
        run: |
          command -v autoconf >/dev/null || { sudo apt-get update && sudo apt-get install -y autoconf; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tests/cross-package/producer.pkg/src/rust -> target
            tests/cross-package/consumer.pkg/src/rust -> target
          shared-key: cross-package
          cache-on-failure: true

      - name: Configure Linux
        run: |
          echo "LD_LIBRARY_PATH=$(R RHOME)/lib" >> "$GITHUB_ENV"

      - name: Build and test cross-package packages
        working-directory: tests/cross-package
        run: |
          just build-all
          just test-all

      # Wrappers sync gate (#1218): unlike rpkg's (gitignored) wrappers.R,
      # producer.pkg/consumer.pkg wrappers.R are TRACKED generated files, and
      # `just build-all` above regenerates them in-tree. If macro codegen
      # changed without the committed snapshots being regenerated, the diff is
      # non-empty here — the cross-package analogue of `wrappers-sync-check`.
      - name: Check committed wrappers.R in sync
        run: |
          git diff --exit-code -- \
            tests/cross-package/producer.pkg/R/producer.pkg-wrappers.R \
            tests/cross-package/consumer.pkg/R/consumer.pkg-wrappers.R \
          || { echo "::error::cross-package wrappers.R drifted from codegen — run 'just cross-install' and commit the regenerated files (#1218)"; exit 1; }

  # ===========================================================================
  # minirextendr (scaffolding helper package)
  # ===========================================================================
  minirextendr:
    name: minirextendr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.r == 'true'
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: minirextendr
          extra-packages: any::rcmdcheck, any::testthat, any::devtools
          needs: check

      - name: Install autoconf
        # ubuntu-latest images ship autoconf; the apt path is only a fallback
        # for image changes (saves ~30-60 s of apt-get update per job).
        run: |
          command -v autoconf >/dev/null || { sudo apt-get update && sudo apt-get install -y autoconf; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        working-directory: minirextendr
        env:
          MINIEXTENDR_LOCAL_PATH: ${{ github.workspace }}
        run: Rscript -e "testthat::set_max_fails(Inf); testthat::test_local()"

      - name: R CMD check
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: minirextendr
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          check-dir: '"check"'

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-minirextendr
          path: minirextendr/check
          retention-days: 7

  # ===========================================================================
  # CRAN-like check (stricter, simulates CRAN environment)
  # ===========================================================================
  cran-check:
    name: CRAN-like check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.r == 'true'
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Tarball install mode is detected by configure.ac from the presence of
      # inst/vendor.tar.xz (produced by `just vendor` below). No NOT_CRAN needed.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      # Skip the gctorture files here for CRAN realism as much as speed: their
      # helper also calls skip_on_cran(), because a half-hour test suite would
      # be rejected by real CRAN. The explicit env var is still needed —
      # r-lib's setup actions export NOT_CRAN=true into every job, so
      # skip_on_cran() alone never fires in CI. See helper-gc-stress.R.
      MINIEXTENDR_SKIP_STRESS: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: rpkg
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install autoconf
        # ubuntu-latest images ship autoconf; the apt path is only a fallback
        # for image changes (saves ~30-60 s of apt-get update per job).
        run: |
          command -v autoconf >/dev/null || { sudo apt-get update && sudo apt-get install -y autoconf; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rpkg/src/rust -> target
          shared-key: cran-check
          cache-on-failure: true

      - name: Configure Linux
        run: |
          echo "LD_LIBRARY_PATH=$(R RHOME)/lib" >> "$GITHUB_ENV"

      # NOTE: the vendor tarball is intentionally NOT cached. It is always
      # regenerated by `just vendor` (--force) in the step below, so caching it
      # bought nothing — and a restored tarball flipped `just configure` into
      # tarball mode, which made cargo-revendor drop in-PR workspace-crate edits
      # and re-fetch the framework from git@main (latch leak, #441 / #865).
      - name: Set up cargo-revendor and vendor
        uses: ./.github/actions/setup-vendor

      - name: Build source tarball
        run: |
          # Remove vendor/ so tarball only contains inst/vendor.tar.xz
          rm -rf rpkg/vendor
          R CMD build rpkg
          echo "TARBALL=$(ls -1 miniextendr_*.tar.gz)" >> $GITHUB_ENV

      - name: R CMD check (CRAN-like, from tarball)
        run: |
          # Check the tarball without NOT_CRAN — configure.ac detects tarball
          # install mode from the presence of inst/vendor.tar.xz (shipped inside
          # the built tarball by `just vendor` above).
          R CMD check --as-cran --no-manual ${{ env.TARBALL }}

      - name: Copy check results
        if: always()
        run: |
          mkdir -p rpkg/check
          mv miniextendr.Rcheck rpkg/check/ 2>/dev/null || true

      - name: Print failed tests
        if: always()
        run: |
          for f in rpkg/check/*.Rcheck/tests/*.Rout.fail; do
            [ -f "$f" ] && echo "=== $f ===" && tail -n100 "$f"
          done || true

      - name: Print 00check.log and 00install.out
        if: always()
        run: |
          echo "=== 00install.out ==="
          cat rpkg/check/*.Rcheck/00install.out 2>/dev/null || echo "00install.out not found"
          echo ""
          echo "=== 00check.log ==="
          cat rpkg/check/*.Rcheck/00check.log 2>/dev/null || echo "00check.log not found"

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-cran-check
          path: |
            rpkg/check
            rpkg/config.log
          retention-days: 7

  # ===========================================================================
  # Bootstrap vendor regression test (#441 latch)
  # ===========================================================================
  bootstrap-vendor-test:
    name: Bootstrap Vendor Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.r == 'true'
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install rv (for .Rprofile activate.R)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RV_VERSION=$(gh api repos/A2-ai/rv/releases/latest --jq .tag_name)
          : "${RV_VERSION:?empty rv version}"
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-connrefused --location \
               --silent --show-error --fail \
               "https://github.com/A2-ai/rv/releases/download/${RV_VERSION}/rv-${RV_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
               -o /tmp/rv.tar.gz
          # Tarball ships a flat `rv` binary at the top level — no subdir.
          tar -xzf /tmp/rv.tar.gz -C /tmp
          sudo install -m 0755 /tmp/rv /usr/local/bin/rv
          rv --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # bootstrap.R calls cargo-revendor which calls `cargo metadata` on the
          # rpkg workspace — cache that workspace's target dir.
          workspaces: rpkg/src/rust -> target
          shared-key: bootstrap-vendor-test
          cache-on-failure: true

      - name: Set up cargo-revendor (install only)
        uses: ./.github/actions/setup-vendor
        with:
          configure-and-vendor: 'false'

      - name: Run bootstrap-vendor regression test
        run: just test-bootstrap-vendor

  # ===========================================================================
  # Standalone round-trip e2e (on-demand: nightly cron + label + dispatch)
  # ===========================================================================
  # Exercises the full standalone (non-monorepo) flow that the per-PR suite
  # cannot afford: create_miniextendr_package() -> miniextendr_build() (auto-
  # vendor flips to tarball mode mid-install) -> wrapper-gen -> install ->
  # library() exposes the functions. This is the #757/#775 regression target:
  # any change that makes a build entry point bypass MINIEXTENDR_FORCE_WRAPPER_GEN
  # (or alters the tarball-mode skip) re-introduces the empty-namespace bug.
  #
  # The assertions live in the gated testthat round-trip at
  # minirextendr/tests/testthat/test-templates.R:521 — CI runs the suite, it does
  # NOT reimplement the checks in shell (per #805). MINIEXTENDR_RUN_E2E=1 lifts
  # skip_e2e()'s skip_on_ci() so the otherwise-skipped e2e tests actually run.
  #
  # On-demand only — NOT in ci-success.needs, so it never gates a PR and adds no
  # minutes to normal runs. Triggers: weekly cron (Sat 06:00 UTC), the `run-e2e`
  # PR label, or `gh workflow run ci.yml --ref <branch>`. Heavy: cold-compiles
  # Rust + autoconf + network-fetches/vendors miniextendr `main`.
  r-roundtrip-e2e:
    name: Standalone round-trip e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: minirextendr
          extra-packages: any::testthat, any::devtools, any::withr, any::roxygen2
          needs: check

      - name: Install autoconf
        # ubuntu-latest images ship autoconf; the apt path is only a fallback
        # for image changes (saves ~30-60 s of apt-get update per job).
        run: |
          command -v autoconf >/dev/null || { sudo apt-get update && sudo apt-get install -y autoconf; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rpkg/src/rust -> target
          shared-key: roundtrip-e2e
          cache-on-failure: true

      # cargo-revendor on PATH so the standalone build's auto-vendor (tarball
      # mode) can seal inst/vendor.tar.xz mid-install.
      - name: Set up cargo-revendor (install only)
        uses: ./.github/actions/setup-vendor
        with:
          configure-and-vendor: 'false'

      - name: Run standalone round-trip e2e
        run: just minirextendr-roundtrip

  # ===========================================================================
  # Summary job (for branch protection)
  # ===========================================================================
  ci-success:
    name: CI Success
    needs:
      - generated-files-check
      - version-check
      - sync-checks
      - docs-link-check
      - rust-lint
      - rust-tests
      - changes
      - r-check-linux
      # - r-check-macos   # non-gating: runs only on workflow_dispatch + weekly cron, see #95
      # - r-check-windows # DISABLED — re-enable when Windows job is uncommented above
      - r-tests
      - r-stress-tests
      - cross-package-tests
      - minirextendr
      - cran-check
      - bootstrap-vendor-test
      # - r-roundtrip-e2e # non-gating: on-demand only (cron / run-e2e label / dispatch), see #775
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results=(
            "${{ needs.generated-files-check.result }}"
            "${{ needs.version-check.result }}"
            "${{ needs.sync-checks.result }}"
            "${{ needs.docs-link-check.result }}"
            "${{ needs.rust-lint.result }}"
            "${{ needs.rust-tests.result }}"
            "${{ needs.changes.result }}"
            "${{ needs.r-check-linux.result }}"
            # "${{ needs.r-check-macos.result }}"   # non-gating, see #95
            # "${{ needs.r-check-windows.result }}" # DISABLED
            "${{ needs.r-tests.result }}"
            "${{ needs.r-stress-tests.result }}"
            "${{ needs.cross-package-tests.result }}"
            "${{ needs.minirextendr.result }}"
            "${{ needs.cran-check.result }}"
            "${{ needs.bootstrap-vendor-test.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "One or more jobs failed: $result"
              exit 1
            fi
          done
          echo "All CI jobs passed!"
