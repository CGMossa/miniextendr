[project]
name = "miniextendr"
r_version = "4.6"

# A list of repositories to fetch packages from. Order matters: we will try to get a package from each repository in order.
# The alias is only used in this file if you want to specifically require a dependency to come from a certain repository.
# Example: { alias = "PPM", url = "https://packagemanager.posit.co/cran/latest" },
repositories = [
    {alias = "stratus", url = "https://prism.dev.a2-ai.cloud/rpkgs/stratus/2026-06-18/"},
    {alias = "CRAN", url = "https://cloud.r-project.org/"},
]

# A list of packages to install and any additional configuration
# Examples:
    # "dplyr",
    # {name = "dplyr", repository = "CRAN"},
    # {name = "dplyr", git = "https://github.com/tidyverse/dplyr.git", tag = "v1.1.4"},
dependencies = [
    {name = "minirextendr", dependencies_only = true, path = "minirextendr"},
    {name = "miniextendr", dependencies_only = true, path = "rpkg"},
    "lifecycle",
    "methods",
    "R6",
    "S7",
    "vctrs",
    "bench",
    "callr",
    "dplyr",
    "ggplot2",
    "scales",
    "testthat",
    "tibble",
    "tidyr",
    "cli",
    "fs",
    "usethis",
    "devtools",
    "knitr",
    "rcmdcheck",
    "rmarkdown",
    # CI's Sync Checks job installs roxygen2 from public RSPM "latest"; the
    # stratus snapshot (2026-06-18) still has 8.0.0, whose NAMESPACE importFrom
    # formatting differs from 8.1.0 — the committed NAMESPACE must be generated
    # by the same major/minor roxygen2 CI regenerates with, or
    # `just wrappers-sync-check` red-flags every PR. Pin to CRAN (latest).
    {name = "roxygen2", repository = "CRAN"},
    "withr",
    "yaml",
    "jsonlite",
    "ggbeeswarm",
]
